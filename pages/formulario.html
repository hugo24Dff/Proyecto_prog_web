<!DOCTYPE html>


<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro pagina</title>

</head>


<Body>
    <h1>Formulario</h1>
    <form action="/prosesar-formulario" method="GET" enctype="multipart/form-data">
        <fieldset>
            <legend>Registro</legend>
            <div>
                <label for="inp-user">Nombre de Usuario </label>
                <input required name="user_name" type="text" id="inp-user" disabled 
                placeholder="Ingresa tu nombre de usuario" aria-describedby="">
            </div>
            <div>
                <label for="inp-email">Ingresa tu Correo </label>
                <input required name="user_email" type="email" id="inp-email" disabled 
                placeholder="Ingresa tu correo " aria-describedby="">
            </div>
            <div>
                <label for="inp-phone">Teléfono</label>
                <input type="tel" id="inp-phone" name="phone" placeholder="612-000-0000" pattern="[0-9]{10}"></input>
            </div>
            <div>
                <label for="inp-edad">Edad </label>
                <input type="number" name="age" id="inp-age" min="18" max="99" step="2">
            </div>

            <div>
                <label for="password">Contraseña</label>
                <input type="password" name="contrasena" placeholder="Ingresa tu contraseña" id="password">
            </div>

            <div>
        <input type="checkbox" id="chk-terminos" value="aceptado">
        <label for="chk-terminos">Aceptar Terminos y Condiciones</label>
        </div>


        </fieldset>



    </form>



</Body>
