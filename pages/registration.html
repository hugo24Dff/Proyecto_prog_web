
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/styles.css">

    <title>Formulario de Registro</title>
    <script type="module" src="../js/main.js"></script>
</head>


<body class="registro-page">

    <main class="registro-container">

        <form id="form-registro"
              class="registro-form"
              action="/procesar-formulario"
              method="GET"
              novalidate>

            <header class="registro-header">
                <h1>Crear una cuenta</h1>
                <p>Únete a TEKHSTORE y descubre nuevos videojuegos.</p>
            </header>

            <fieldset>
                <legend>Información personal</legend>

                <div class="form-group">
                    <label for="inp-user">Nombre de usuario</label>
                    <input
                        required
                        name="user_name"
                        type="text"
                        id="inp-user"
                        placeholder="Ej. Gamer123"
                        aria-describedby="error-user">

                    <span id="error-user" class="error"
                          aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="inp-email">Correo electrónico</label>
                    <input
                        required
                        name="user_email"
                        type="email"
                        id="inp-email"
                        placeholder="correo@ejemplo.com"
                        aria-describedby="error-email">

                    <span id="error-email" class="error"
                          aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="inp-phone">Teléfono</label>
                    <input
                        name="phone"
                        type="tel"
                        id="inp-phone"
                        placeholder="6120000000"
                        aria-describedby="error-phone">

                    <span id="error-phone" class="error"
                          aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="inp-age">Edad</label>
                    <input
                        name="age"
                        type="number"
                        id="inp-age"
                        min="18"
                        max="99"
                        step="2"
                        placeholder="18"
                        aria-describedby="error-age">

                    <span id="error-age" class="error"
                          aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        required
                        name="contrasena"
                        type="password"
                        id="password"
                        placeholder="Ingresa tu contraseña"
                        aria-describedby="error-password">

                    <span id="error-password" class="error"
                          aria-live="polite"></span>
                </div>

                <div class="form-terms">
                    <input
                        required
                        type="checkbox"
                        id="chk-terminos"
                        name="terminos"
                        value="aceptado"
                        aria-describedby="error-terminos">

                    <label for="chk-terminos">
                        Acepto los términos y condiciones
                    </label>
                </div>

                <span id="error-terminos" class="error"
                      aria-live="polite"></span>

                <button type="submit" class="registro-button">
                    Crear cuenta
                </button>

                <p id="mensaje-exito" role="status"
                   aria-live="polite"></p>

            </fieldset>

            <footer class="registro-footer">
                <p>TEKHSTORE &copy; 2026</p>
            </footer>

        </form>

    </main>

</body>

</html>
