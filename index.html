<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="description" content="Explora, descarga y disfruta los mejores videojuegos digitales con ofertas exclusivas cada semana." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <title>TEKHSTORE: Tienda digital de Videojuegos</title>
</head>
<body class="page-layout">

  <!-- HEADER / NAVBAR -->
  <header class="site-header">
    <div class="header-container">
      <a href="/index.html" class="site-logo">
        <span class="logo__icon">⚙</span>
        <span class="logo__text">TEKHSTORE<span>.COM</span></span>
      </a>

      <div class="search-bar">
        <span class="search-bar__icon">🔍</span>
        <input type="text" placeholder="Buscar productos..." class="search-bar__input" />
      </div>

      <nav class="site-nav">
        <div class="nav__links">
          <a href="/index.html" class="nav__link active">INICIO</a>
          <a href="/pages/offers.html" class="nav__link">OFERTAS</a>
          <a href="/pages/recomendations.html" class="nav__link">RECOMENDACIONES</a>
        </div>

        <div class="nav__user-actions">
          <button class="icon-btn" title="Notificaciones">
            🔔<span class="badge">3</span>
          </button>
          <button class="icon-btn" title="Carrito">🛒</button>
          <div class="user-profile">
            <span class="user-profile__avatar">👤</span>
            <span class="user-profile__name">chopon7</span>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="site-main">
    
    <!-- BANNER HERO -->
    <section class="hero-banner">
      <div class="hero-banner__image-container">
        <img src="assets/img/star-wars-battlefront-2.jpg" alt="Star Wars Battlefront II" class="hero-banner__image" />
        <div class="hero-banner__overlay">
          <a href="#" class="hero-banner__btn"><u> > COMPRAR YA < </u></a>
        </div>
      </div>
    </section>

    <!-- SECCIÓN JUEGOS POPULARES (TAMAÑO RESTAURADO) -->
    <section class="games">
      <header class="trending-section__header">
        <h2><strong>Juegos Populares</strong></h2>
        <a href="#" class="btn-view-all">Ver todo ></a>
      </header>

      <!-- Listado con Flexbox (flex-wrap, gap y flex: 1 1 sin márgenes manuales) -->
      <div class="games__list">
        <figure class="game-card">
          <img class="game-card__image" src="assets/img/rainbow-six-siege.jpg" alt="Rainbow Six Siege" width="300" height="175" loading="lazy" title="Rainbow Six Siege" />
          <figcaption class="game-card__caption">
            Rainbow Six Siege
          </figcaption>
        </figure>

        <figure class="game-card">
          <img class="game-card__image" src="assets/img/kof-xv.webp" alt="The King Of Fighters XV" width="300" height="175" loading="lazy" title="The King Of Fighters XV" />
          <figcaption class="game-card__caption">
            The King Of Fighters XV
          </figcaption>
        </figure>

        <figure class="game-card">
          <img class="game-card__image" src="assets/img/arkham-knight.png" alt="Batman Arkham Knight" width="300" height="175" loading="lazy" title="Batman Arkham Knight" />
          <figcaption class="game-card__caption">
            Batman Arkham Knight
          </figcaption>
        </figure>
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="site-footer">

Ricardo Álvarez Higuera.
    </pre>
  </footer>

</body>
</html>
